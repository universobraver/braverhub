<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Conteúdo - Manual</title>
  <!-- Script de Identidade do Netlify -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Script principal do Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // Se o usuário fizer login pelo widget do Netlify Identity, abre o CMS diretamente na mesma página
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            // Recarrega a página dentro do /admin/ para o CMS capturar o token de acesso
            window.location.reload();
          });
        }
      });
    }
  </script>
</body>
</html>
