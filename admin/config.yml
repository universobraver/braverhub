backend:
  name: github
  repo: universobraver/braverhub.github.io
  branch: main

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "conteudo_site"
    label: "Gerenciar Conteúdo do Site"
    files:
      - file: "conteudo.json"
        label: "Textos do Manual e Hub"
        name: "conteudo"
        fields:
          - { label: "Título Principal", name: "titulo_principal", widget: "string" }
          - { label: "Subtítulo", name: "subtitulo", widget: "string" }
          - { label: "Título do Manual", name: "manual_titulo", widget: "string" }
          - { label: "Subtítulo do Manual", name: "manual_subtitulo", widget: "string" }
          - { label: "Texto de Créditos", name: "creditos_texto", widget: "markdown" }
          - { label: "Introdução dos Sistemas", name: "introducao_sistemas", widget: "markdown" }
